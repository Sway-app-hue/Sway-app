<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cliply</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
    }

    /* -------------------------
       VIDEO FEED
    ------------------------- */

    #feed {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }

    #feed::-webkit-scrollbar {
      display: none;
    }

    .video-card {
      width: 100%;
      height: 100vh;
      position: relative;
      scroll-snap-align: start;
      background: #111;
      overflow: hidden;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        transparent 55%,
        rgba(0, 0, 0, 0.15) 70%,
        rgba(0, 0, 0, 0.75) 100%
      );
    }

    /* -------------------------
       TOP BAR
    ------------------------- */

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      text-shadow: 0 2px 10px black;
    }

    .tabs {
      position: absolute;
      right: 15px;
      display: flex;
      gap: 10px;
    }

    .tab {
      border: 0;
      color: white;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      pointer-events: auto;
    }

    .tab.active {
      background: white;
      color: black;
    }

    /* -------------------------
       INFO
    ------------------------- */

    .info {
      position: absolute;
      left: 15px;
      right: 90px;
      bottom: 75px;
      z-index: 5;
    }

    .username {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .description {
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .sound {
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* -------------------------
       ACTION BUTTONS
    ------------------------- */

    .actions {
      position: absolute;
      right: 12px;
      bottom: 75px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .action {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: white;
    }

    .action button {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      color: white;
      font-size: 25px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .action button:active {
      transform: scale(0.8);
    }

    .action button.liked {
      color: #ff2d55;
    }

    .count {
      font-size: 12px;
      text-shadow: 0 1px 4px black;
    }

    /* -------------------------
       BOTTOM NAV
    ------------------------- */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 58px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-button {
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-button span:first-child {
      font-size: 22px;
    }

    .nav-button.active {
      color: white;
    }

    .upload-button {
      width: 45px;
      height: 32px;
      border-radius: 8px;
      border: 2px solid white;
      background: linear-gradient(90deg, #00f2ea, #ff0050);
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    /* -------------------------
       MODAL
    ------------------------- */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: flex-end;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 600px;
      max-height: 75%;
      background: #181818;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 20px;
    }

    .close {
      background: #333;
      border: 0;
      color: white;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .comment-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .comment {
      padding: 12px 0;
      border-bottom: 1px solid #333;
    }

    .comment strong {
      margin-right: 6px;
    }

    .comment-input {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .comment-input input {
      flex: 1;
      border: 0;
      outline: none;
      padding: 12px;
      border-radius: 20px;
      background: #292929;
      color: white;
    }

    .comment-input button {
      border: 0;
      background: #fe2c55;
      color: white;
      border-radius: 20px;
      padding: 0 16px;
      cursor: pointer;
    }

    /* -------------------------
       UPLOAD MODAL
    ------------------------- */

    .upload-box {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .upload-box input,
    .upload-box textarea {
      width: 100%;
      padding: 13px;
      border: 0;
      outline: none;
      border-radius: 10px;
      background: #292929;
      color: white;
      resize: none;
    }

    .upload-box button {
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #fe2c55;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* -------------------------
       PROFILE
    ------------------------- */

    #profile {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #111;
      display: none;
      overflow-y: auto;
    }

    #profile.show {
      display: block;
    }

    .profile-header {
      padding: 70px 20px 30px;
      text-align: center;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff0050, #00f2ea);
      margin: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 35px;
      font-weight: bold;
    }

    .profile-name {
      font-size: 22px;
      margin-top: 12px;
      font-weight: bold;
    }

    .profile-stats {
      display: flex;
      justify-content: center;
      gap: 35px;
      margin-top: 20px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      text-align: center;
      gap: 4px;
    }

    .stat strong {
      font-size: 18px;
    }

    .stat span {
      color: #aaa;
      font-size: 13px;
    }

    .back-profile {
      position: absolute;
      top: 15px;
      left: 15px;
      border: 0;
      background: #333;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
    }

    /* -------------------------
       DESKTOP
    ------------------------- */

    @media (min-width: 700px) {
      #app {
        max-width: 500px;
        margin: auto;
        box-shadow: 0 0 50px rgba(255,255,255,0.1);
      }

      .bottom-nav,
      .topbar {
        max-width: 500px;
        left: 50%;
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>

<div id="app">

  <!-- TOP -->
  <div class="topbar">
    <div class="logo">Cliply</div>

    <div class="tabs">
      <button class="tab active" onclick="setFeed('forYou', this)">
        Für dich
      </button>

      <button class="tab" onclick="setFeed('following', this)">
        Folge ich
      </button>
    </div>
  </div>

  <!-- VIDEO FEED -->
  <main id="feed"></main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button class="nav-button active" onclick="goHome()">
      <span>⌂</span>
      <span>Home</span>
    </button>

    <button class="nav-button" onclick="showSearch()">
      <span>⌕</span>
      <span>Entdecken</span>
    </button>

    <button class="upload-button" onclick="openUpload()">
      +
    </button>

    <button class="nav-button">
      <span>♡</span>
      <span>Inbox</span>
    </button>

    <button class="nav-button" onclick="openProfile()">
      <span>☺</span>
      <span>Profil</span>
    </button>

  </nav>

  <!-- COMMENTS -->
  <div class="modal" id="commentModal">
    <div class="modal-content">

      <div class="modal-header">
        <h2>Kommentare</h2>
        <button class="close" onclick="closeComments()">×</button>
      </div>

      <div class="comment-list" id="commentList"></div>

      <div class="comment-input">
        <input
          id="commentInput"
          type="text"
          placeholder="Kommentar schreiben..."
          maxlength="200"
        >

        <button onclick="addComment()">
          Senden
        </button>
      </div>

    </div>
  </div>

  <!-- UPLOAD -->
  <div class="modal" id="uploadModal">

    <div class="modal-content">

      <div class="modal-header">
        <h2>Video erstellen</h2>
        <button class="close" onclick="closeUpload()">×</button>
      </div>

      <div class="upload-box">

        <input
          id="videoFile"
          type="file"
          accept="video/*"
        >

        <input
          id="uploadUsername"
          type="text"
          placeholder="Dein Benutzername"
          value="@du"
          maxlength="30"
        >

        <textarea
          id="uploadDescription"
          placeholder="Beschreibung..."
          maxlength="200"
          rows="4"
        ></textarea>

        <button onclick="uploadVideo()">
          Video hinzufügen
        </button>

      </div>

    </div>

  </div>

  <!-- PROFILE -->
  <section id="profile">

    <button class="back-profile" onclick="closeProfile()">
      ←
    </button>

    <div class="profile-header">

      <div class="avatar">
        D
      </div>

      <div class="profile-name">
        @du
      </div>

      <div class="profile-stats">

        <div class="stat">
          <strong id="followingCount">0</strong>
          <span>Folge ich</span>
        </div>

        <div class="stat">
          <strong id="followersCount">128</strong>
          <span>Follower</span>
        </div>

        <div class="stat">
          <strong id="likesCount">0</strong>
          <span>Likes</span>
        </div>

      </div>

    </div>

  </section>

</div>


<script>

  /*
   * --------------------------------
   * DATEN
   * --------------------------------
   */

  const videos = [

    {
      id: 1,
      username: "@alex",
      description: "Ein schöner Tag! 🌅",
      sound: "Originalton",
      video:
        "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
      likes: 124,
      comments: [
        {
          user: "@max",
          text: "Cool! 🔥"
        },
        {
          user: "@lena",
          text: "Sieht schön aus!"
        }
      ],
      liked: false,
      following: true
    },

    {
      id: 2,
      username: "@sam",
      description: "Willkommen bei Cliply 👋",
      sound: "Originalton",
      video:
        "https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4",
      likes: 842,
      comments: [
        {
          user: "@tom",
          text: "Mega!"
        }
      ],
      liked: false,
      following: false
    },

    {
      id: 3,
      username: "@mia",
      description: "Was für ein Ausblick! 🌄",
      sound: "Originalton",
      video:
        "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm",
      likes: 2310,
      comments: [],
      liked: false,
      following: true
    }

  ];


  let currentCommentVideo = null;


  /*
   * --------------------------------
   * FEED RENDERN
   * --------------------------------
   */

  function renderFeed(list = videos) {

    const feed = document.getElementById("feed");

    feed.innerHTML = "";

    list.forEach(video => {

      const card = document.createElement("article");

      card.className = "video-card";

      card.dataset.id = video.id;

      card.innerHTML = `

        <video
          src="${video.video}"
          loop
          playsinline
          preload="metadata"
        ></video>

        <div class="video-overlay"></div>

        <div class="info">

          <div class="username">
            ${escapeHTML(video.username)}
          </div>

          <div class="description">
            ${escapeHTML(video.description)}
          </div>

          <div class="sound">
            ♪ ${escapeHTML(video.sound)}
          </div>

        </div>

        <div class="actions">

          <div class="action">

            <button
              class="${video.liked ? "liked" : ""}"
              onclick="likeVideo(${video.id}, this)"
            >
              ♥
            </button>

            <span class="count">
              ${formatNumber(video.likes)}
            </span>

          </div>

          <div class="action">

            <button onclick="openComments(${video.id})">
              💬
            </button>

            <span class="count">
              ${video.comments.length}
            </span>

          </div>

          <div class="action">

            <button onclick="shareVideo(${video.id})">
              ↗
            </button>

            <span class="count">
              Teilen
            </span>

          </div>

          <div class="action">

            <button onclick="muteVideo(this)">
              🔊
            </button>

          </div>

        </div>
      `;

      feed.appendChild(card);

    });

    setupVideoObserver();

  }


  /*
   * --------------------------------
   * AUTOPLAY
   * --------------------------------
   */

  function setupVideoObserver() {

    const observer = new IntersectionObserver(
      entries => {

        entries.forEach(entry => {

          const video = entry.target;

          if (entry.isIntersecting) {

            document
              .querySelectorAll("#feed video")
              .forEach(v => {

                if (v !== video) {
                  v.pause();
                }

              });

            video.play().catch(() => {});

          } else {

            video.pause();

          }

        });

      },
      {
        threshold: 0.7
      }
    );


    document
      .querySelectorAll("#feed video")
      .forEach(video => {

        observer.observe(video);

        video.addEventListener("click", () => {

          if (video.paused) {
            video.play();
          } else {
            video.pause();
          }

        });

      });

  }


  /*
   * --------------------------------
   * LIKEN
   * --------------------------------
   */

  function likeVideo(id, button) {

    const video = videos.find(v => v.id === id);

    if (!video) return;

    video.liked = !video.liked;

    if (video.liked) {
      video.likes++;
      button.classList.add("liked");
    } else {
      video.likes--;
      button.classList.remove("liked");
    }

    const count =
      button.parentElement.querySelector(".count");

    count.textContent = formatNumber(video.likes);

    updateProfileLikes();

  }


  /*
   * --------------------------------
   * KOMMENTARE
   * --------------------------------
   */

  function openComments(id) {

    const video = videos.find(v => v.id === id);

    if (!video) return;

    currentCommentVideo = video;

    const list =
      document.getElementById("commentList");

    list.innerHTML = "";

    if (video.comments.length === 0) {

      list.innerHTML =
        `<div style="color:#aaa;padding:20px 0;">
          Noch keine Kommentare.
        </div>`;

    } else {

      video.comments.forEach(comment => {

        const div = document.createElement("div");

        div.className = "comment";

        div.innerHTML = `
          <strong>${escapeHTML(comment.user)}</strong>
          ${escapeHTML(comment.text)}
        `;

        list.appendChild(div);

      });

    }

    document
      .getElementById("commentModal")
      .classList.add("show");

  }


  function closeComments() {

    document
      .getElementById("commentModal")
      .classList.remove("show");

    currentCommentVideo = null;

  }


  function addComment() {

    if (!currentCommentVideo) return;

    const input =
      document.getElementById("commentInput");

    const text = input.value.trim();

    if (!text) return;

    currentCommentVideo.comments.push({
      user: "@du",
      text: text
    });

    input.value = "";

    openComments(currentCommentVideo.id);

    renderFeed();

    updateProfileLikes();

  }


  /*
   * --------------------------------
   * TEILEN
   * --------------------------------
   */

  async function shareVideo(id) {

    const video = videos.find(v => v.id === id);

    if (!video) return;

    const text =
      `${video.username}: ${video.description}`;

    if (navigator.share) {

      try {

        await navigator.share({
          title: "Cliply",
          text: text
        });

      } catch (error) {}

    } else {

      try {

        await navigator.clipboard.writeText(text);

        alert("Text wurde kopiert!");

      } catch {

        alert(text);

      }

    }

  }


  /*
   * --------------------------------
   * TON
   * --------------------------------
   */

  function muteVideo(button) {

    const card =
      button.closest(".video-card");

    const video =
      card.querySelector("video");

    video.muted = !video.muted;

    button.textContent =
      video.muted ? "🔇" : "🔊";

  }


  /*
   * --------------------------------
   * UPLOAD
   * --------------------------------
   */

  function openUpload() {

    document
      .getElementById("uploadModal")
      .classList.add("show");

  }


  function closeUpload() {

    document
      .getElementById("uploadModal")
      .classList.remove("show");

  }


  function uploadVideo() {

    const fileInput =
      document.getElementById("videoFile");

    const username =
      document
        .getElementById("uploadUsername")
        .value
        .trim() || "@du";

    const description =
      document
        .getElementById("uploadDescription")
        .value
        .trim() || "Mein neues Video!";

    const file = fileInput.files[0];

    if (!file) {

      alert("Bitte wähle zuerst ein Video aus.");

      return;

    }

    if (!file.type.startsWith("video/")) {

      alert("Bitte wähle eine Videodatei.");

      return;

    }

    const url = URL.createObjectURL(file);

    const newVideo = {

      id: Date.now(),

      username: username,

      description: description,

      sound: "Originalton",

      video: url,

      likes: 0,

      comments: [],

      liked: false,

      following: true

    };

    videos.unshift(newVideo);

    renderFeed();

    closeUpload();

    fileInput.value = "";

    document
      .getElementById("uploadDescription")
      .value = "";

  }


  /*
   * --------------------------------
   * FEED FILTER
   * --------------------------------
   */

  function setFeed(type, button) {

    document
      .querySelectorAll(".tab")
      .forEach(tab => {
        tab.classList.remove("active");
      });

    button.classList.add("active");

    if (type === "following") {

      const following =
        videos.filter(video => video.following);

      renderFeed(following);

    } else {

      renderFeed(videos);

    }

  }


  /*
   * --------------------------------
   * PROFIL
   * --------------------------------
   */

  function openProfile() {

    document
      .getElementById("profile")
      .classList.add("show");

    updateProfileLikes();

  }


  function closeProfile() {

    document
      .getElementById("profile")
      .classList.remove("show");

  }


  function updateProfileLikes() {

    let likes = 0;

    videos.forEach(video => {

      if (video.liked) {
        likes += video.likes;
      }

    });

    document.getElementById("likesCount")
      .textContent = formatNumber(likes);

  }


  /*
   * --------------------------------
   * HOME
   * --------------------------------
   */

  function goHome() {

    closeProfile();

    document
      .getElementById("feed")
      .scrollTo({
        top: 0,
        behavior: "smooth"
      });

  }


  /*
   * --------------------------------
   * SUCHE
   * --------------------------------
   */

  function showSearch() {

    const search = prompt(
      "Wonach möchtest du suchen?"
    );

    if (search === null) return;

    const term = search
      .toLowerCase()
      .trim();

    if (!term) {

      renderFeed(videos);

      return;

    }

    const results = videos.filter(video =>

      video.username
        .toLowerCase()
        .includes(term)

      ||

      video.description
        .toLowerCase()
        .includes(term)

    );

    renderFeed(results);

    if (results.length === 0) {

      alert("Keine Videos gefunden.");

    }

  }


  /*
   * --------------------------------
   * HILFSFUNKTIONEN
   * --------------------------------
   */

  function formatNumber(number) {

    if (number >= 1000000) {

      return (
        (number / 1000000)
          .toFixed(1)
          .replace(".0", "") + "M"
      );

    }

    if (number >= 1000) {

      return (
        (number / 1000)
          .toFixed(1)
          .replace(".0", "") + "K"
      );

    }

    return number;

  }


  function escapeHTML(value) {

    const div = document.createElement("div");

    div.textContent = value;

    return div.innerHTML;

  }


  /*
   * --------------------------------
   * MODALS SCHLIESSEN
   * --------------------------------
   */

  document
    .getElementById("commentModal")
    .addEventListener("click", event => {

      if (
        event.target.id === "commentModal"
      ) {

        closeComments();

      }

    });


  document
    .getElementById("uploadModal")
    .addEventListener("click", event => {

      if (
        event.target.id === "uploadModal"
      ) {

        closeUpload();

      }

    });


  /*
   * --------------------------------
   * TASTATUR
   * --------------------------------
   */

  document.addEventListener("keydown", event => {

    if (event.key === "Escape") {

      closeComments();
      closeUpload();
      closeProfile();

    }

  });


  /*
   * --------------------------------
   * START
   * --------------------------------
   */

  renderFeed(videos);

</script>

</body>
</html>
